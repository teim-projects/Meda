<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Golden Outer Starburst Ring -->
  <g fill="#D4AF37" stroke="#B8860B" stroke-width="1">
    <circle cx="50" cy="50" r="48"/>
  </g>
  <!-- Outer Petals Pattern -->
  <g fill="#F5D061">
    <path d="M 50,2 L 53,10 L 47,10 Z"/>
    <path d="M 50,98 L 53,90 L 47,90 Z"/>
    <path d="M 2,50 L 10,53 L 10,47 Z"/>
    <path d="M 98,50 L 90,53 L 90,47 Z"/>
    <path d="M 16,16 L 23,22 L 18,27 Z"/>
    <path d="M 84,16 L 77,22 L 82,27 Z"/>
    <path d="M 16,84 L 23,78 L 18,73 Z"/>
    <path d="M 84,84 L 77,78 L 82,73 Z"/>
  </g>
  <!-- Inner Golden Circle -->
  <circle cx="50" cy="50" r="38" fill="#E6C200" stroke="#997A00" stroke-width="2"/>
  <circle cx="50" cy="50" r="32" fill="#FFF8DC" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Central Diya / Samai Lamp Graphic -->
  <path d="M 42,65 Q 50,70 58,65 L 56,52 L 44,52 Z" fill="#D4AF37" stroke="#8B6508" stroke-width="1.5"/>
  <path d="M 50,30 Q 56,42 50,52 Q 44,42 50,30 Z" fill="#FF8C00"/>
  <circle cx="50" cy="44" r="3" fill="#FFD700"/>
  <!-- Base Stand -->
  <rect x="40" y="65" width="20" height="4" fill="#B8860B" rx="1"/>
  <!-- Circular Devanagari Inscription Ring Representation -->
  <circle cx="50" cy="50" r="27" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
