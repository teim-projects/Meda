<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 110" width="90" height="110">
  <g fill="#4A3B32" stroke="#2B211B" stroke-width="0.8">
    <!-- Center Lion Face & Mane -->
    <path d="M 45,15 Q 35,10 32,25 Q 30,35 38,45 L 52,45 Q 60,35 58,25 Q 55,10 45,15 Z"/>
    <circle cx="41" cy="24" r="2" fill="#000"/>
    <circle cx="49" cy="24" r="2" fill="#000"/>
    <path d="M 43,30 Q 45,33 47,30" fill="none" stroke="#000" stroke-width="1.5"/>
    <path d="M 38,36 Q 45,42 52,36" fill="none" stroke="#000" stroke-width="1.2"/>
    <!-- Left Lion Silhouette -->
    <path d="M 30,22 Q 18,20 18,32 Q 18,42 28,48 L 35,46 Z"/>
    <!-- Right Lion Silhouette -->
    <path d="M 60,22 Q 72,20 72,32 Q 72,42 62,48 L 55,46 Z"/>
    <!-- Abacus Base -->
    <rect x="15" y="52" width="60" height="12" fill="#5C493E" rx="2"/>
    <!-- Ashoka Chakra Wheel -->
    <circle cx="45" cy="58" r="5" fill="#FFF" stroke="#000080" stroke-width="1"/>
    <circle cx="45" cy="58" r="1.5" fill="#000080"/>
    <!-- Lotus Pedestal Base -->
    <path d="M 20,64 Q 45,74 70,64 L 65,76 Q 45,82 25,76 Z" fill="#6E584B"/>
    <line x1="20" y1="64" x2="70" y2="64" stroke="#3A2D26" stroke-width="2"/>
  </g>
  <!-- Devanagari Satyameva Jayate Text -->
  <text x="45" y="98" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Arial Unicode MS', sans-serif" font-weight="800" font-size="10" fill="#2B211B">सत्यमेव जयते</text>
</svg>
